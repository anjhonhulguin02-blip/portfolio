    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b14;
        transition: opacity 0.5s ease;
      }
      #preloader.preloader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .preloader-logo {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        opacity: 0;
        animation: preloader-fade-in 0.7s ease forwards;
      }
      #preloader .preloader-logo span {
        background: linear-gradient(90deg, #a855f7, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #preloader .preloader-bar {
        margin: 1.5rem auto 0;
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }
      #preloader .preloader-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a855f7, #ec4899);
        animation: preloader-slide 1.1s ease-in-out infinite;
      }
      @keyframes preloader-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes preloader-slide {
        0% { transform: translateX(-120%); }
        50% { transform: translateX(150%); }
        100% { transform: translateX(150%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .preloader-logo { animation: none; opacity: 1; }
        #preloader .preloader-bar-fill { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div style="text-align: center;">
        <p class="preloader-logo">Anjhon<span>.</span></p>
        <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var MIN_MS = 500;
        var MAX_MS = 2500;
        var start = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var el = document.getElementById("preloader");
          if (!el) return;
          var wait = Math.max(0, MIN_MS - (Date.now() - start));
          setTimeout(function () {
            el.classList.add("preloader-hidden");
            setTimeout(function () { el.remove(); }, 550);
          }, wait);
        }
        window.addEventListener("load", hide);
        setTimeout(hide, MAX_MS);
      })();
    </script>
  </body>
